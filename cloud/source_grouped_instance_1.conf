[program:rsqlora_setup]
command=/bin/bash /workspace/rsqlora-review/cloud/setup_source_grouped.sh
directory=/workspace/rsqlora-review
environment=CUDA_VISIBLE_DEVICES="0",PYTHONUNBUFFERED="1"
autostart=false
autorestart=false
startsecs=2
stdout_logfile=/workspace/rsqlora-review/results/source_grouped_setup.log
stderr_logfile=/workspace/rsqlora-review/results/source_grouped_setup.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:rsqlora_revision]
command=/bin/bash /workspace/rsqlora-review/cloud/run_source_grouped_instance.sh
directory=/workspace/rsqlora-review
environment=INSTANCE_ID="1",CUDA_VISIBLE_DEVICES="0",PYTHONUNBUFFERED="1"
autostart=false
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/rsqlora-review/results/source_grouped_worker.log
stderr_logfile=/workspace/rsqlora-review/results/source_grouped_worker.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
